<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CReLeRI</title>
    <link rel="icon" href="data:,">
    <link href="{{ url_for('static', filename='plugins/bootstrap/bootstrap.css') }}" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
        integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
    <!-- Icon subset: list any newly used Material Symbols in icon_names (alphabetical). -->
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;icon_names=expand_circle_down,expand_circle_up&amp;display=block">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/main-style.css') }}" rel="stylesheet" />
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js"
        integrity="sha384-ma33ZEb8L5emtidZhYJFZNIFdht2E8f5wHQMKQGom0aIx9rRKm86XXCjGxOISpM9"
        crossorigin="anonymous" defer></script>
    <script src="{{ url_for('static', filename='js/fileUpload.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>

<body style="overflow: hidden;">
    <!-- Wrapper -->
    <div id="wrapper">
        <div id="page-wrapper">
            <div class="row">
                <!-- Left Column -->
                <div class="col-lg-5 col-md-5 col-sm-12 col-xs-12 main-boxes conversation-width">
                    <div class="panel panel-primary">
                        <div class="panel-heading output-panel-header d-flex" style="display: flex;flex-direction: column;">
                            <div class="p-2" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <h2 class="header" style="margin: 0;">Conversation</h2>
                                    <div id="videoLoader" class="video-processing-indicator">
                                        <div id='video-processing-counter' style="margin: auto;"></div>
                                        <div class="video-loader"></div>
                                    </div>
                                    <div id="segmentation-type-selection-buttons" class="buttons-container">
                                        <select id="segmentation-type-select" class="btn btn-default view-button" aria-label="Segmentation mode">
                                            <option value="0">Segmentation Model</option>
                                            <option value="1">Uniform Segmentation</option>
                                            <option value="2">No Segmentation</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="conversation-area-wrapper">
                            <div id="conversation-area">
                                <div style="margin-top: auto"></div>
                                <!-- Messages will be appended here -->
                            </div>
                            <!-- Input Group with Upload and Send Buttons -->
                            <div class="input-group">
                                <textarea rows=1 id="user-input" class="form-control"
                                    placeholder="Type your message..." aria-label="Message"></textarea>
                                <span class="input-group-btn">
                                    <input type="file" id="file-upload" class="sr-only" accept="video/*" multiple
                                        aria-label="Upload videos" data-max-bytes="{{ max_upload_bytes }}"/>
                                    <label id="file-label" for="file-upload" class="btn btn-default custom-file-upload">
                                        <i class="fas fa-paperclip" aria-hidden="true"></i>
                                    </label>
                                    <button class="btn btn-default" type="button" id="send-message" disabled>Send</button>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="col-lg-7 col-md-5 col-sm-12 col-xs-12 main-boxes video-width">
                    <!-- Media Player -->
                    <div class="panel panel-primary">
                        <div class="panel-heading output-panel-header" style="display: flex; flex-direction: column;">
                            <div style="display: flex; flex-direction: row;justify-content:space-between">
                            <h2 class="header">Media Viewer</h2>
                            </div>
                        </div>
                        <div id="video-panel" class="panel-body">
                            <div id='media-player' class="col-md-12">
                                <div style="flex-grow: 1;width: auto;height: 100% !important;">
                                    <img id='media-video' alt="" style="width: 100%;  object-fit: cover;  aspect-ratio: 16 / 9;background-color: black;">
                                 </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <div class="row">
                <div class="col-lg-12 main-boxes">
                    <!-- Concept Visualization -->
                    <div class="panel panel-primary" id="cytoscape-box" >
                        <div class="panel-heading output-panel-header d-flex flex-row">
                            <div class="p-2">
                                <h2 class="header" id="concept-visualization-header">Concept Visualization</h2>
                            </div>
                            <div id="video-question-buttons" class="buttons-container p-2">
                                <button id="concept-visualization-collapsible-btn" class="btn btn-default view-button" style="background-color: transparent;" onclick="conceptVisualizationCollapsable()"
                                    aria-label="Concept visualization" aria-controls="concept-visualization-box" aria-expanded="true">
                                    <span class="material-symbols-outlined" aria-hidden="true">
                                        expand_circle_up
                                    </span>
                                </button>
                            </div>

                        </div>
                        <div id="concept-visualization-box" style="overflow: auto !important;height: 35vh;">
                            <div id="list-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
